apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-batch-orchestrator
  namespace: batch-orchestrator
  labels:
    app: distributed-batch-orchestrator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: distributed-batch-orchestrator
  template:
    metadata:
      labels:
        app: distributed-batch-orchestrator
    spec:
      containers:
        - name: distributed-batch-orchestrator
          image: distributed-batch-orchestrator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: DB_URL
              value: "jdbc:h2:tcp://h2:9092//data/orchestrator"
            - name: APP_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-batch-orchestrator
  namespace: batch-orchestrator
spec:
  type: ClusterIP
  selector:
    app: distributed-batch-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-batch-orchestrator-external
  namespace: batch-orchestrator
spec:
  type: NodePort
  selector:
    app: distributed-batch-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
