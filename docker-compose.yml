# This compose file mirrors the "kubernetes mode" topology locally:
# - kafka: single-node KRaft broker used for remote partitioning (consumer group)
# - h2: shared TCP database server (all 6 app instances point at it)
# - app-1..app-6: six identical containers built from the same image, one
#   becomes Master at runtime (dynamic election) - no per-instance config
#   other than APP_INSTANCE_ID / port mapping.
# Equivalent to the k8s/ manifests, for local validation of the distributed
# (non-local-mode) code path without a real cluster.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: batch-orchestrator-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9094:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s
    networks:
      - batch-net

  h2:
    image: oscarfonts/h2:latest
    container_name: batch-orchestrator-h2
    environment:
      H2_OPTIONS: "-ifNotExists"
    ports:
      - "9092:1521"
    volumes:
      - h2-data:/opt/h2-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1521' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - batch-net

  app-1:
    build: .
    container_name: batch-orchestrator-app-1
    environment:
      SPRING_PROFILES_ACTIVE: kubernetes
      APP_INSTANCE_ID: app-1
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:h2:tcp://h2:1521//opt/h2-data/orchestrator
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      h2:
        condition: service_healthy
    networks:
      - batch-net

  app-2:
    build: .
    container_name: batch-orchestrator-app-2
    environment:
      SPRING_PROFILES_ACTIVE: kubernetes
      APP_INSTANCE_ID: app-2
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:h2:tcp://h2:1521//opt/h2-data/orchestrator
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8081:8080"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      h2:
        condition: service_healthy
    networks:
      - batch-net

  app-3:
    build: .
    container_name: batch-orchestrator-app-3
    environment:
      SPRING_PROFILES_ACTIVE: kubernetes
      APP_INSTANCE_ID: app-3
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:h2:tcp://h2:1521//opt/h2-data/orchestrator
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8082:8080"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      h2:
        condition: service_healthy
    networks:
      - batch-net

  app-4:
    build: .
    container_name: batch-orchestrator-app-4
    environment:
      SPRING_PROFILES_ACTIVE: kubernetes
      APP_INSTANCE_ID: app-4
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:h2:tcp://h2:1521//opt/h2-data/orchestrator
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8083:8080"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      h2:
        condition: service_healthy
    networks:
      - batch-net

  app-5:
    build: .
    container_name: batch-orchestrator-app-5
    environment:
      SPRING_PROFILES_ACTIVE: kubernetes
      APP_INSTANCE_ID: app-5
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:h2:tcp://h2:1521//opt/h2-data/orchestrator
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8084:8080"
    restart: on-failure
    depends_on:
      kafka:
